<script type="module">
import { THREE, gsap, ScrollTrigger, makeRenderer, makeComposer, makeGradePass, attachLifecycle, smoothScroll, loop, onResize, loaderOverlay, mapClamp } from '../../shared/lib.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const loader = loaderOverlay();

// ---------------------------------------------------------------- shared GLSL noise
const NOISE = `
float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i=floor(x),f=fract(x); f=f*f*(3.0-2.0*f);
 return mix(mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*vnoise(p); p*=2.02; a*=0.5; } return v; }
`;

// ---------------------------------------------------------------- data
const BODIES = [
  { key:'sun', label:'Sol', type:'star', r:14, x:0, accent:'#ff9d3c', realDist:0,
    data:[['CLASS','G2V dwarf'],['SURFACE','5 500 °C'],['MASS','333 000 × Earth']],
    blurb:'The anchor of it all — 99.86% of the system’s mass, fusing 600 million tonnes of hydrogen every second.' },
  { key:'mercury', label:'Mercury', type:'rocky', r:1.7, x:36, accent:'#c2b2a0', realDist:57.9e6,
    colorA:'#4f463e', colorB:'#9a8c7a', colorC:'#6b6058',
    data:[['DISTANCE','57.9M km'],['DIAMETER','4 879 km'],['ORBIT','88 days']],
    blurb:'Closest to the fire and scorched by it — a vast iron core wrapped in a thin, cratered shell of rock.' },
  { key:'venus', label:'Venus', type:'rocky', r:2.5, x:58, accent:'#ffce85', atmo:'#ffce85', realDist:108.2e6,
    colorA:'#8a6a3a', colorB:'#dcbf82', colorC:'#caa86a',
    data:[['DISTANCE','108.2M km'],['DIAMETER','12 104 km'],['ORBIT','225 days']],
    blurb:'A runaway greenhouse at 465 °C, hidden under crushing clouds of sulphuric acid. The hottest world here.' },
  { key:'earth', label:'Earth', type:'earth', r:2.6, x:84, accent:'#5ab0ff', atmo:'#5aa6ff', realDist:149.6e6,
    colorA:'#0f3a72', colorB:'#2f7d4d', colorC:'#c8a86a',
    data:[['DISTANCE','149.6M km'],['DIAMETER','12 742 km'],['ORBIT','365 days']],
    blurb:'The only world we know that woke up. A film of blue air, four-hundredths of the radius thick, holds back the void.' },
  { key:'mars', label:'Mars', type:'rocky', r:2.0, x:110, accent:'#ff6f4a', atmo:'#ff7a52', realDist:227.9e6,
    colorA:'#6e2c1c', colorB:'#c85a35', colorC:'#e3a071',
    data:[['DISTANCE','227.9M km'],['DIAMETER','6 779 km'],['ORBIT','687 days']],
    blurb:'The rusted desert. Dry riverbeds and Olympus Mons — three times the height of Everest — speak of a warmer past.' },
  { key:'jupiter', label:'Jupiter', type:'gas', r:9, x:158, accent:'#e8bc80', atmo:'#e8c79a', realDist:778.5e6,
    colorA:'#9c7244', colorB:'#d6c094', colorC:'#bf4a2c',
    data:[['DISTANCE','778.5M km'],['DIAMETER','139 820 km'],['ORBIT','12 years']],
    blurb:'A failed star and a giant shield. Its storm — the Great Red Spot — has churned for over three centuries.' },
  { key:'saturn', label:'Saturn', type:'gas', r:7.6, x:212, accent:'#f0d9a0', atmo:'#f0e2bc', ring:true, realDist:1.434e9,
    colorA:'#b89a6a', colorB:'#dccb9a', colorC:'#cdb487',
    data:[['DISTANCE','1.43B km'],['DIAMETER','116 460 km'],['ORBIT','29 years']],
    blurb:'The jewel — billions of icy shards, few thicker than a house, spread into rings 280 000 km across.' },
  { key:'uranus', label:'Uranus', type:'ice', r:4.4, x:258, accent:'#a6ece4', atmo:'#b4f0ea', realDist:2.871e9,
    colorA:'#2e8a8a', colorB:'#abe9e5', colorC:'#7fd0cc',
    data:[['DISTANCE','2.87B km'],['DIAMETER','50 724 km'],['ORBIT','84 years']],
    blurb:'Knocked onto its side long ago, it rolls around the Sun lying down — each pole left in 42 years of night.' },
  { key:'neptune', label:'Neptune', type:'ice', r:4.3, x:302, accent:'#5a86ff', atmo:'#6a92ff', realDist:4.495e9,
    colorA:'#1c2f8a', colorB:'#4f7cff', colorC:'#9ab0ff',
    data:[['DISTANCE','4.50B km'],['DIAMETER','49 244 km'],['ORBIT','165 years']],
    blurb:'The last planet. Winds scream across it at 2 100 km/h — the fastest in the system — over an ocean-blue haze.' },
  { key:'hole', label:'The Edge', type:'hole', r:5, x:362, accent:'#bf8cff', realDist:-1,
    data:[['OBJECT','Black hole'],['ESCAPE V.','> light'],['RETURN','none']],
    blurb:'Past the last world, where gravity folds light into a ring. Whatever crosses the edge belongs to it now.' },
];
const OVERVIEW = { key:'overview', label:'The System', type:'overview', accent:'#9fc0ff', realDist:0,
  data:[['STAR','1'],['PLANETS','8'],['SPAN','9 billion km']],
  blurb:'One star, eight worlds, and the long dark between them. Scroll to fall outward — from the Sun to the edge of light.' };

// ---------------------------------------------------------------- renderer / scene
const renderer = makeRenderer();
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 4000);
camera.position.set(-20, 55, 180);

// ---------------------------------------------------------------- starfield
function makeStars(count, radius) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3), siz = new Float32Array(count);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(radius * (0.5 + Math.random() * 0.5));
    pos.set([v.x, v.y, v.z], i * 3);
    const t = Math.random();
    c.setHSL(0.55 + (Math.random() - 0.5) * 0.18, 0.5, 0.6 + t * 0.4);
    col.set([c.r, c.g, c.b], i * 3);
    siz[i] = 0.6 + Math.pow(Math.random(), 6) * 4.5;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('size', new THREE.BufferAttribute(siz, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTex: { value: dot() } },
    vertexShader: `attribute float size; attribute vec3 color; varying vec3 vC;
      void main(){ vC=color; vec4 mv=modelViewMatrix*vec4(position,1.0);
      // clamp the divisor AND the result: a star crossing the camera plane (-mv.z → 0)
      // yields an infinite/negative point size, which ANGLE/D3D11 expands into a giant
      // NaN quad — rasterized as a huge black rectangle over the frame
      float d = max(-mv.z, 1.0);
      gl_PointSize = min(size * (300.0 / d), 64.0);
      gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `uniform sampler2D uTex; varying vec3 vC;
      void main(){ vec4 t=texture2D(uTex, gl_PointCoord); gl_FragColor=vec4(vC,1.0)*t; }`,
  });
  return new THREE.Points(g, m);
}
function dot() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, '#fff'); grd.addColorStop(0.3, 'rgba(255,255,255,0.6)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const stars = makeStars(4500, 1600);
scene.add(stars);

// ---------------------------------------------------------------- sun
const sunUniforms = { uTime: { value: 0 } };
const sun = new THREE.Mesh(
  new THREE.IcosahedronGeometry(BODIES[0].r, 32),
  new THREE.ShaderMaterial({
    uniforms: sunUniforms,
    vertexShader: `varying vec3 vObj; varying vec3 vW; varying vec3 vWN;
      void main(){ vObj=position; vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz;
        vWN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*viewMatrix*w; }`,
    // Photosphere look: limb darkening (edge darker + redder than the centre, the single
    // strongest "real sun" cue) over fine LOW-contrast granulation — the old two-octave
    // high-contrast fbm read as big morphing lava-lamp blotches at full resolution.
    fragmentShader: NOISE + `uniform float uTime; varying vec3 vObj; varying vec3 vW; varying vec3 vWN;
      void main(){
        vec3 p = normalize(vObj);
        vec3 V = normalize(cameraPosition - vW);
        float mu = clamp(dot(normalize(vWN), V), 0.0, 1.0);   // 1 centre → 0 limb
        float limb = pow(mu, 0.5);
        float gran = fbm(p*6.0 + vec3(uTime*0.04)) * 0.55
                   + fbm(p*16.0 - vec3(uTime*0.025)) * 0.45;
        // filtered-photograph look (SDO): saturated yellow-orange disc with visible
        // granulation cells and sparse darker spots — NOT a clipped white disc; the
        // "glow" is bloom's job, so the surface itself must stay below clipping.
        float spots = smoothstep(0.34, 0.2, fbm(p*3.5 + vec3(7.31)));
        vec3 edge = vec3(0.85, 0.25, 0.05);
        vec3 mid  = vec3(1.0, 0.62, 0.20);
        vec3 core = vec3(1.0, 0.82, 0.45);
        vec3 col = mix(edge, mid, limb);
        col = mix(col, core, limb*limb);
        col *= 0.72 + gran * 0.42;                            // visible cell structure
        col *= 1.0 - spots * 0.45 * limb;                     // sunspots, centre only
        // sweet spot between the two failure modes: 0.72 read as a matte beige ball,
        // anything past ~1.0 + full bloom clipped the centre to a flat white disc.
        // Peak ≈ 1.0 → ACES renders a hot yellow centre that keeps its granulation,
        // and only the top granules cross the 0.8 bloom threshold.
        gl_FragColor = vec4(col * 0.88, 1.0);
      }`,
  })
);
scene.add(sun);
// corona
const corona = new THREE.Mesh(
  new THREE.IcosahedronGeometry(BODIES[0].r * 1.7, 16),
  new THREE.ShaderMaterial({
    transparent: true, blending: THREE.AdditiveBlending, side: THREE.BackSide, depthWrite: false,
    uniforms: {},
    vertexShader: `varying vec3 vN; varying vec3 vW; void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `varying vec3 vN; varying vec3 vW;
      void main(){ vec3 v=normalize(cameraPosition-vW);
        // clamp the pow base: interpolation pushes |dot| past 1.0, and pow(negative, 1.8)
        // is NaN in GLSL — one NaN texel smears into giant black blocks in bloom's mips
        float f=pow(clamp(1.0-abs(dot(vN,v)),0.0,1.0),1.8);
        vec3 col = mix(vec3(0.9,0.3,0.08), vec3(1.0,0.6,0.2), f);  // redder outer falloff
        gl_FragColor=vec4(col*f, f*0.85); }`,
  })
);
sun.add(corona);
// the "hot" centre is an additive glow sprite OVER the disc, not overdriven surface RGB —
// pushing the shader past 1.0 clips to a flat white disc, while a soft radial glow keeps
// the granulation visible underneath (standard WebGL-sun trick)
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: (() => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0, 'rgba(255,246,220,.9)');
    gr.addColorStop(0.32, 'rgba(255,200,110,.42)');
    gr.addColorStop(0.62, 'rgba(255,150,60,.12)');
    gr.addColorStop(1, 'rgba(255,140,50,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  })(),
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, opacity: 1,
}));
sunGlow.scale.set(BODIES[0].r * 2.1, BODIES[0].r * 2.1, 1);
sun.add(sunGlow);
// lens flare — a cheap additive sprite sells the star as a light source; faded out
// once the journey leaves the inner system (and frustum-culled behind the camera).
const flareTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const core = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  core.addColorStop(0, 'rgba(255,240,220,.95)'); core.addColorStop(0.25, 'rgba(255,170,90,.35)'); core.addColorStop(1, 'rgba(255,150,60,0)');
  g.fillStyle = core; g.fillRect(0, 0, 256, 256);
  const streak = g.createLinearGradient(0, 128, 256, 128);
  streak.addColorStop(0, 'rgba(255,200,140,0)'); streak.addColorStop(0.5, 'rgba(255,220,180,.5)'); streak.addColorStop(1, 'rgba(255,200,140,0)');
  g.fillStyle = streak; g.fillRect(0, 124, 256, 8);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const flare = new THREE.Sprite(new THREE.SpriteMaterial({
  map: flareTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, opacity: 0.9,
}));
flare.scale.set(90, 90, 1);
scene.add(flare);

// ---------------------------------------------------------------- textures (real planet maps)
// Solar System Scope (CC-BY 4.0), equirectangular — sampled in-shader from the object-space normal.
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const manager = new THREE.LoadingManager();
const texLoader = new THREE.TextureLoader(manager);
const MAPS = { mercury:'mercury', venus:'venus_atmosphere', earth:'earth_daymap', mars:'mars',
  jupiter:'jupiter', saturn:'saturn', uranus:'uranus', neptune:'neptune' };
function loadTex(file, srgb) {
  const t = texLoader.load(`./textures/${file}`);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = maxAniso; t.wrapS = THREE.RepeatWrapping;
  return t;
}

// ---------------------------------------------------------------- planet factory
const planetVert = `varying vec3 vObj; varying vec3 vW; varying vec3 vWN;
  void main(){ vObj=position; vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; vWN=normalize(mat3(modelMatrix)*normal);
  gl_Position=projectionMatrix*viewMatrix*w; }`;
const planetFrag = `
  uniform sampler2D uMap; varying vec3 vObj; varying vec3 vW; varying vec3 vWN;
  const float INV_PI = 0.3183098862, INV_2PI = 0.1591549431;
  void main(){
    vec3 n = normalize(vObj);
    vec3 wn = normalize(vWN);
    vec3 L = normalize(-vW);                       // sun sits at the origin
    float d = clamp(dot(wn, L), 0.0, 1.0);
    float term = smoothstep(-0.05, 0.35, dot(wn, L));
    // atan(0,0) at the poles is undefined (NaN UVs) — nudge x when both args vanish
    float nx = n.x + step(abs(n.x) + abs(n.z), 1e-6) * 1e-6;
    vec2 uv = vec2(atan(n.z, nx) * INV_2PI + 0.5, asin(clamp(n.y,-1.0,1.0)) * INV_PI + 0.5);
    vec3 col = texture2D(uMap, uv).rgb;
    vec3 night = col * 0.03;                        // faint dark side
    col = mix(night, col, term) * (0.30 + 0.70*d);
    vec3 V = normalize(cameraPosition - vW);
    float fres = pow(1.0 - clamp(dot(wn,V),0.0,1.0), 3.0);
    col += col * fres * 0.45 * d;                   // lit-limb glow in the body's own colour
    gl_FragColor = vec4(col, 1.0);
  }`;

// Earth gets its own surface: NASA Black Marble city lights on the night side and a
// drifting cloud layer (both reused from 21-earth-descent's texture set, see SOURCES.md).
const earthFrag = `
  uniform sampler2D uMap; uniform sampler2D uNight; uniform sampler2D uClouds; uniform float uTime;
  varying vec3 vObj; varying vec3 vW; varying vec3 vWN;
  const float INV_PI = 0.3183098862, INV_2PI = 0.1591549431;
  void main(){
    vec3 n = normalize(vObj);
    vec3 wn = normalize(vWN);
    vec3 L = normalize(-vW);
    float d = clamp(dot(wn, L), 0.0, 1.0);
    float term = smoothstep(-0.08, 0.3, dot(wn, L));
    // atan(0,0) at the poles is undefined (NaN UVs) — nudge x when both args vanish
    float nx = n.x + step(abs(n.x) + abs(n.z), 1e-6) * 1e-6;
    vec2 uv = vec2(atan(n.z, nx) * INV_2PI + 0.5, asin(clamp(n.y,-1.0,1.0)) * INV_PI + 0.5);
    vec3 day = texture2D(uMap, uv).rgb;
    float cl = texture2D(uClouds, vec2(uv.x + uTime*0.004, uv.y)).a;  // density lives in alpha (RGB is flat white)
    day = mix(day, vec3(1.0), cl * 0.85);                       // clouds catch the light
    vec3 nightSide = texture2D(uNight, uv).rgb * vec3(1.35,1.15,0.85) * 1.7;
    nightSide *= 1.0 - cl * 0.6;                                // clouds occlude the city lights
    vec3 col = mix(nightSide, day * (0.25 + 0.85*d), term);
    vec3 V = normalize(cameraPosition - vW);
    float fres = pow(1.0 - clamp(dot(wn,V),0.0,1.0), 3.0);
    col += vec3(0.35,0.55,1.0) * fres * 0.5 * (0.25 + d);       // blue scatter rim
    gl_FragColor = vec4(col, 1.0);
  }`;

function makePlanet(cfg) {
  const g = new THREE.Group();
  const isEarth = cfg.key === 'earth';
  const uniforms = { uMap:{ value: loadTex(MAPS[cfg.key] + '.jpg', true) } };
  if (isEarth) {
    uniforms.uNight = { value: loadTex('earth_night.jpg', true) };
    uniforms.uClouds = { value: loadTex('earth_clouds.png', false) };
    uniforms.uTime = { value: 0 };
  }
  const mat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: planetVert, fragmentShader: isEarth ? earthFrag : planetFrag,
  });
  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(cfg.r, 24), mat);
  body.rotation.z = (cfg.key === 'uranus') ? 1.6 : 0.15;
  g.add(body);
  if (cfg.atmo) {
    const atmo = new THREE.Mesh(
      new THREE.IcosahedronGeometry(cfg.r * 1.13, 16),
      new THREE.ShaderMaterial({
        transparent:true, blending:THREE.AdditiveBlending, side:THREE.BackSide, depthWrite:false,
        uniforms:{ uColor:{value:new THREE.Color(cfg.atmo)} },
        vertexShader:`varying vec3 vN; varying vec3 vW; void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
        fragmentShader:`uniform vec3 uColor; varying vec3 vN; varying vec3 vW;
          void main(){ vec3 V=normalize(cameraPosition-vW); vec3 L=normalize(-vW);
            // clamped pow base — see corona: pow(negative, x) is NaN
            float f=pow(clamp(1.0-abs(dot(vN,V)),0.0,1.0),2.0); float lit=clamp(dot(vN,L),0.0,1.0);
            // keep the night limb dark — a uniform halo reads as a sticker ring, not air
            gl_FragColor=vec4(uColor*f*(0.22+1.25*lit), min(f*(0.35+1.05*lit), 1.0)); }`,
      })
    );
    g.add(atmo);
  }
  if (cfg.ring) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(cfg.r * 1.35, cfg.r * 2.3, 160),
      new THREE.ShaderMaterial({
        transparent:true, side:THREE.DoubleSide, depthWrite:false,
        uniforms:{ uInner:{value:cfg.r*1.35}, uOuter:{value:cfg.r*2.3},
          uRingColor:{value:loadTex('saturn_ring_color.jpg', true)}, uRingAlpha:{value:loadTex('saturn_ring_alpha.gif', false)} },
        vertexShader:`varying vec3 vObj; varying vec3 vW; void main(){ vObj=position; vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
        fragmentShader: `uniform float uInner; uniform float uOuter; uniform sampler2D uRingColor; uniform sampler2D uRingAlpha; varying vec3 vObj; varying vec3 vW;
          void main(){ float r=length(vObj.xy); float t=clamp((r-uInner)/(uOuter-uInner),0.0,1.0);
            vec3 col = texture2D(uRingColor, vec2(t, 0.5)).rgb;       // real radial ring profile
            float a = texture2D(uRingAlpha, vec2(t, 0.5)).r;          // transparency pattern (Cassini gaps etc.)
            gl_FragColor = vec4(col, a); }`,
      })
    );
    ring.rotation.x = Math.PI * 0.5 - 0.42;
    g.add(ring);
  }
  g.position.set(cfg.x, 0, 0);
  scene.add(g);
  return { group: g, body, mat, cfg };
}
const planets = BODIES.filter(b => b.type !== 'star' && b.type !== 'hole').map(makePlanet);
const earthMat = planets.find(p => p.cfg.key === 'earth').mat;

// interplanetary dust — near-field parallax so the long transits between worlds read
// as motion instead of empty black
const dust = (() => {
  const n = 1500;
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = -30 + Math.random() * 420;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 52;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 72;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  // custom points shader: fade to zero near the lens — the camera flies through this
  // band, and a grain crossing right in front of the camera reads as a bright blob glitch
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTex: { value: dot() } },
    vertexShader: `varying float vFade;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        float d = -mv.z;
        vFade = smoothstep(2.5, 10.0, d) * (1.0 - smoothstep(60.0, 140.0, d));
        // same guard as the starfield: unclamped size/d explodes into a giant black
        // quad on ANGLE/D3D11 when a grain crosses the camera plane
        gl_PointSize = clamp(42.0 / max(d, 0.75), 0.0, 48.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `uniform sampler2D uTex; varying float vFade;
      void main(){
        vec4 t = texture2D(uTex, gl_PointCoord);
        gl_FragColor = vec4(vec3(0.62,0.71,0.87), 1.0) * t * vFade * 0.35;
      }`,
  });
  return new THREE.Points(g, m);
})();
scene.add(dust);

// orbit rings — visible in the overview so the bead chain reads as a *system*,
// faded out before they could slice through the close-up planet framings
const orbitMat = new THREE.LineBasicMaterial({
  color: 0x6f86c8, transparent: true, opacity: 0.14, blending: THREE.AdditiveBlending, depthWrite: false,
});
const orbits = new THREE.Group();
for (const b of BODIES.filter(b => b.type !== 'star' && b.type !== 'hole')) {
  const pts = [];
  for (let a = 0; a <= 160; a++) {
    const th = (a / 160) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(th) * b.x, 0, Math.sin(th) * b.x));
  }
  orbits.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), orbitMat));
}
scene.add(orbits);

// ---------------------------------------------------------------- black hole
const holeCfg = BODIES.find(b => b.key === 'hole');
const hole = new THREE.Group(); hole.position.set(holeCfg.x, 0, 0);
const horizon = new THREE.Mesh(new THREE.SphereGeometry(holeCfg.r, 48, 48), new THREE.MeshBasicMaterial({ color: 0x000000 }));
hole.add(horizon);
const photon = new THREE.Mesh(
  new THREE.TorusGeometry(holeCfg.r * 1.06, 0.13, 24, 180),
  new THREE.MeshBasicMaterial({ color: 0xfff2dc, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })
);
hole.add(photon);
const diskUniforms = { uTime:{value:0}, uInner:{value:holeCfg.r*1.6}, uOuter:{value:holeCfg.r*5.6} };
const disk = new THREE.Mesh(
  new THREE.RingGeometry(holeCfg.r * 1.6, holeCfg.r * 5.6, 240, 8),
  new THREE.ShaderMaterial({
    transparent:true, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms: diskUniforms,
    vertexShader:`varying vec3 vObj; void main(){ vObj=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: NOISE + `uniform float uTime; uniform float uInner; uniform float uOuter; varying vec3 vObj;
      void main(){ float r=length(vObj.xy); float t=clamp((r-uInner)/(uOuter-uInner),0.0,1.0);
        float ang=atan(vObj.y,vObj.x);
        float swirl=fbm(vec3(ang*3.0 - uTime*0.6 + t*5.0, t*5.0, uTime*0.1));
        vec3 hot=vec3(1.0,0.97,0.9), mid=vec3(1.0,0.6,0.25), cold=vec3(0.55,0.2,0.6);
        vec3 col=mix(hot,mid,smoothstep(0.0,0.4,t)); col=mix(col,cold,smoothstep(0.45,1.0,t));
        float bright=(1.0-t)*(0.55+0.7*swirl);
        float a=smoothstep(1.0,0.7,t)*smoothstep(0.0,0.06,t)*(0.6+0.5*swirl);
        gl_FragColor=vec4(col*bright*1.3, a); }`,
  })
);
disk.rotation.x = Math.PI * 0.5 - 0.12;
hole.add(disk);
scene.add(hole);

// ---------------------------------------------------------------- stations (camera waypoints)
// Camera direction: get CLOSE. Every body should dominate its frame (roughly two thirds
// of frame height, offset right of the panel), with the terminator running through it —
// distance is what made the first cut read as a lifeless bead chain.
const stations = [];
stations.push({ ...OVERVIEW, cam: { pos: new THREE.Vector3(-34, 22, 86), aim: new THREE.Vector3(110, -8, 0) } });
for (const b of BODIES) {
  let pos, aim = new THREE.Vector3(b.x + b.r * 0.5, 0, 0);
  // star cam at 3.0r with the corona at 1.7r: the straight lerp path to Mercury has to
  // clear the corona shell — at 2.7r/1.85r the camera clipped through it (full-screen
  // orange wash right after the Sol station)
  if (b.type === 'star')      { pos = new THREE.Vector3(b.x - b.r * 0.4, b.r * 0.6, b.r * 3.4); aim = new THREE.Vector3(b.x + b.r * 0.4, 0, 0); }
  else if (b.type === 'hole') { pos = new THREE.Vector3(b.x - b.r * 0.3, b.r * 3.4, b.r * 7.6); aim = new THREE.Vector3(b.x, 0, 0); }
  else if (b.ring)            pos = new THREE.Vector3(b.x - b.r * 0.5, b.r * 1.5, b.r * 4.7);
  else if (b.type === 'gas')  pos = new THREE.Vector3(b.x - b.r * 0.7, b.r * 0.7, b.r * 3.4);
  else                        pos = new THREE.Vector3(b.x - b.r * 0.9, b.r * 0.55, b.r * 2.9);
  stations.push({ ...b, cam: { pos, aim } });
}

// ---------------------------------------------------------------- panels + HUD
const panelWrap = document.querySelector('.panels');
stations.forEach((s, i) => {
  const el = document.createElement('article');
  el.className = 'panel';
  el.innerHTML =
    `<div class="idx mono">${String(i).padStart(2, '0')} / ${String(stations.length - 1).padStart(2, '0')}</div>
     <h2 class="label display">${s.label}</h2>
     <dl class="data">${s.data.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
     <p class="blurb">${s.blurb}</p>`;
  panelWrap.appendChild(el);
});
const panels = [...panelWrap.children];
const hudVal = document.querySelector('.hud .val');
const hudFill = document.querySelector('.hud .rail > i');
const root = document.documentElement;
const fmtKm = (km) => km < 0 ? '∞' : km === 0 ? '0 km' : km >= 1e9 ? (km / 1e9).toFixed(2) + 'B km' : (km / 1e6).toFixed(1) + 'M km';

// ---------------------------------------------------------------- post
const composer = makeComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// last line of defence before bloom: scrub NaN/negative/infinite texels. On real GPUs a
// single NaN (pow of a negative base, atan(0,0), …) smears across bloom's mip chain into
// huge black rectangles — software rasterizers never show this, so it survived headless
// verification for days.
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv);
      if (c.r != c.r || c.g != c.g || c.b != c.b || c.a != c.a) c = vec4(0.0, 0.0, 0.0, 1.0);
      gl_FragColor = clamp(c, 0.0, 64.0); }`,
}));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.6, 0.8);
composer.addPass(bloom);
const grade = makeGradePass({ aberration: 0.0015, vignetteMin: 0.6, grain: 0.025 });
composer.addPass(grade);

// ---------------------------------------------------------------- scroll state
smoothScroll({ lerp: 0.07 });
document.querySelector('.spacer').style.height = (stations.length * 100) + 'vh';
const state = { t: 0, snap: false };
// scrub:true — Lenis already smooths user scroll; scrub:1's time-based catch-up never
// settles inside the screenshot harness's wait at software-render fps.
ScrollTrigger.create({ trigger: '.spacer', start: 'top top', end: 'bottom bottom', scrub: true,
  onUpdate: (self) => { state.t = self.progress; } });

const smoother = (x) => x * x * x * (x * (x * 6 - 15) + 10);
const _pos = new THREE.Vector3(), _aim = new THREE.Vector3(), _curAim = new THREE.Vector3().copy(stations[0].cam.aim);
camera.position.copy(stations[0].cam.pos);
// programmatic jumps (screenshot harness) skip the cinematic camera lag; real scrolling never does
if (window.__scrollTo) {
  const origScrollTo = window.__scrollTo;
  window.__scrollTo = (p) => { origScrollTo(p); state.snap = true; };
}

function updateUI(seg) {
  const active = Math.round(seg);
  panels.forEach((el, i) => { el.style.opacity = Math.max(0, 1 - Math.abs(seg - i) * 1.7).toFixed(3); });
  root.style.setProperty('--accent', stations[active].accent);
  const i = Math.min(Math.floor(seg), stations.length - 2), f = smoother(seg - i);
  const a = stations[i].realDist, b = stations[i + 1].realDist;
  hudVal.textContent = (a < 0 || b < 0) ? '∞' : fmtKm(a + (b - a) * f);
  hudFill.style.width = (state.t * 100).toFixed(1) + '%';
}

// ---------------------------------------------------------------- resize + render
onResize((w, h) => { camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); composer.setSize(w, h); bloom.setSize(w, h); });
attachLifecycle(renderer, scene, composer);

loop((elapsed, dt) => {
  const seg = state.t * (stations.length - 1);
  const i = Math.min(Math.floor(seg), stations.length - 2), f = smoother(seg - i);
  _pos.lerpVectors(stations[i].cam.pos, stations[i + 1].cam.pos, f);
  _aim.lerpVectors(stations[i].cam.aim, stations[i + 1].cam.aim, f);
  // frame-rate-independent smoothing: same settle time at 12fps (headless) or 60fps.
  // Snap ONLY on explicit __scrollTo() calls (screenshot harness) — a t-delta heuristic
  // also fired on fast real scrolling (scrollbar drags, hard flicks) and made the camera
  // judder through stations.
  if (state.snap) {
    camera.position.copy(_pos);
    _curAim.copy(_aim);
    state.snap = false;
  }
  const ka = 1 - Math.exp(-7.0 * dt);
  camera.position.lerp(_pos, ka);
  _curAim.lerp(_aim, Math.min(1, ka * 1.3)); camera.lookAt(_curAim);

  sunUniforms.uTime.value = elapsed;
  // tame bloom while the frame is dominated by the sun — full strength returns for the
  // outer system and the black-hole finale, which live off it
  bloom.strength = mapClamp(seg, 0.8, 2.0, 0.45, 0.7);
  diskUniforms.uTime.value = elapsed;
  disk.rotation.z = elapsed * 0.06;
  for (const p of planets) { p.body.rotation.y += dt * 0.06; }   // textures are static; just spin the bodies
  earthMat.uniforms.uTime.value = elapsed;
  // distance-shot effect only: at the Sol close-up the sprite sits right on the disc
  // and repaints the centre as a white blob (+ its streak), so it must be gone by seg 1
  flare.material.opacity = mapClamp(seg, 0.25, 0.95, 0.85, 0);
  flare.visible = flare.material.opacity > 0.01;
  // centre glow stays through the Sol close-up, gone once the sun is behind us
  sunGlow.material.opacity = mapClamp(seg, 1.6, 2.4, 1, 0);
  sunGlow.visible = sunGlow.material.opacity > 0.01;
  orbitMat.opacity = mapClamp(seg, 0.9, 1.6, 0.14, 0);
  orbits.visible = orbitMat.opacity > 0.005;
  stars.rotation.y = elapsed * 0.003;
  grade.uniforms.uTime.value = elapsed;
  updateUI(seg);
  composer.render();
});

// close the loader once the planet maps are decoded (or on error, so it never hangs)
manager.onLoad = () => { loader.set(1); setTimeout(() => loader.done(), 400); };
manager.onError = () => { loader.set(1); setTimeout(() => loader.done(), 500); };
</script>
</body>
</html>
