<style>

  :root { --accent: #ff2fb0; }
  body { background: #07040d; color: #f3e9ff; }

<script type="module">
import { THREE, gsap, ScrollTrigger, makeRenderer, makeComposer, makeGradePass, attachLifecycle, smoothScroll, loop, onResize, loaderOverlay, reducedMotion } from '../../shared/lib.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const loader = loaderOverlay();

// ---------------------------------------------------------------- stations (the narrative beats)
const STATIONS = [
  { label: 'Entry', z: 0, accent: '#ff2fb0',
    data: [['SECTOR', '9 — Low Row'], ['RAIN', 'Continuous'], ['CURFEW', '02:00']],
    blurb: 'Neon leaks into the wet street before it ever hits the eye — every sign doubles itself in the puddles below.' },
  { label: 'Noodle Row', z: -70, accent: '#28e5ff',
    data: [['VENDORS', '40+ stalls'], ['STEAM', 'Rising'], ['SIGNAGE', 'Cyan dominant']],
    blurb: 'Steam off the food stalls catches the cyan signs and scatters them into soft halos overhead.' },
  { label: 'Data Market', z: -150, accent: '#ffb23c',
    data: [['TRAFFIC', 'Grey market'], ['DRONES', 'Patrol sweep'], ['LIGHT', 'Amber warning']],
    blurb: 'Amber warning strips replace the neon here — a quieter street that still watches you back.' },
  { label: 'The Undercut', z: -260, accent: '#ff2fb0',
    data: [['DEPTH', 'Sub-level 3'], ['SKY', 'Not visible'], ['EXIT', 'None marked']],
    blurb: 'The alley narrows and the signs stack higher, fighting for a sliver of a sky nobody down here has seen.' },
];
const N = STATIONS.length;
const totalZ = STATIONS[N - 1].z;

// ---------------------------------------------------------------- renderer / scene
const renderer = makeRenderer();
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a0c14');
scene.fog = new THREE.FogExp2('#0a0c14', 0.02);
const camera = new THREE.PerspectiveCamera(78, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 3.2, 8);

const ALLEY_HALF_W = 3.6; // narrow alley so buildings read close-up and signs fill the frame

// SECTION: buildings — Task 2
// ---------------------------------------------------------------- deterministic RNG (mulberry32)
const prng = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// ---------------------------------------------------------------- window atlas (12x24 lit/dark cells)
// Baked once; the facade shader below samples it in WORLD space so window rows line up with real
// floor heights instead of stretching across whatever size box happens to wear the material.
const ATLAS_COLS = 12, ATLAS_ROWS = 24, ATLAS_SIZE = 1024;
function buildWindowAtlas() {
  const c = document.createElement('canvas'); c.width = c.height = ATLAS_SIZE;
  const g = c.getContext('2d');
  const rnd = prng(90210);
  const cw = ATLAS_SIZE / ATLAS_COLS, ch = ATLAS_SIZE / ATLAS_ROWS;
  const shade = (hex, factor) => {
    const col = new THREE.Color(hex);
    const r = Math.min(1, col.r * factor), gg = Math.min(1, col.g * factor), b = Math.min(1, col.b * factor);
    return `rgb(${Math.round(r * 255)},${Math.round(gg * 255)},${Math.round(b * 255)})`;
  };
  g.fillStyle = '#0b0d11'; // dark concrete spandrel — this is what shows between windows now
  g.fillRect(0, 0, ATLAS_SIZE, ATLAS_SIZE);
  for (let row = 0; row < ATLAS_ROWS; row++) {
    for (let col = 0; col < ATLAS_COLS; col++) {
      const x = col * cw, y = row * ch;
      const roll = rnd();
      if (roll < 0.64) {
        // unlit pane: slightly darker than the concrete + a faint frame so it still reads as
        // glass, not a solid gap in the wall
        g.fillStyle = '#0a0c10';
        g.fillRect(x, y, cw, ch);
        g.strokeStyle = 'rgba(255,255,255,0.05)';
        g.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
        continue;
      }
      // cinematic warm-dominant roll: mostly amber, sparse cool/magenta/green accents
      const hue = roll < 0.86 ? '#ffb46a' : roll < 0.92 ? '#b3742e' : roll < 0.96 ? '#9fc4ff'
        : roll < 0.98 ? '#ff6ad5' : '#7fd8a8'; // last sliver: green TV glow, pairs with the shader's flicker hash
      const half = rnd() < 0.15; // half-drawn blind: top lit, bottom dark
      const bright = 1 + (rnd() - 0.5) * 0.6; // +/-30%
      // window fills only the centered portion of the cell — the rest stays dark concrete/mullion,
      // which is the actual fix for "giant glowing slab" towers
      const winW = cw * 0.58, winH = ch * 0.52;
      const winX = x + (cw - winW) / 2, winY = y + (ch - winH) / 2;
      const litH = half ? winH / 2 : winH;
      g.fillStyle = shade(hue, bright);
      g.fillRect(winX, winY, winW, litH);
      if (rnd() < 0.15) {
        g.fillStyle = 'rgba(11,13,17,0.55)'; // curtain strip across part of the lit pane
        const stripX = winX + winW * (0.35 + rnd() * 0.3);
        g.fillRect(stripX, winY, winW * 0.12, litH);
      }
    }
  }
  for (let row = 0; row < ATLAS_ROWS; row += 6) {
    // floor slab: pure black and thick enough (≈1/3 of a floor's row height) to survive bloom
    // bleed from the lit windows directly above/below it — a thin or mid-grey band washed out
    g.fillStyle = 'rgba(0,0,0,1)';
    g.fillRect(0, row * ch, ATLAS_SIZE, ch * 0.3);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  // the facade shader wraps UV with fract() per-fragment, which makes automatic mip-LOD derivatives
  // explode at every wrap seam (GPU sees a huge fake coordinate jump) — the visible symptom was every
  // tower reading as a handful of smeared solid-color blobs instead of a crisp window grid. Flat
  // filtering with no mip chain sidesteps that entirely (aliasing at extreme distance is an acceptable
  // trade — fog hides those towers anyway).
  tex.generateMipmaps = false;
  tex.minFilter = THREE.LinearFilter;
  return tex;
}
const windowAtlas = buildWindowAtlas();

// ---------------------------------------------------------------- facade material (shared by every tier)
// World-space UV mapping (2m bay x 3.3m floor) means one shader serves boxes of any size — base/mid/
// crown/back-row towers all reuse this single MeshStandardMaterial + onBeforeCompile. Per the repo's
// documented pitfall (PLAN.md, 02 recon): MeshStandardMaterial + onBeforeCompile gets instanceMatrix
// applied to position/normal automatically (USE_INSTANCING) — only raw ShaderMaterial needs it by hand.
// vWpos/vNrm here are a *parallel* world-space varying for the window shader, computed independently
// of (and without disturbing) that built-in pipeline.
const facadeUniforms = { uTime: { value: 0 } };
const facadeMat = new THREE.MeshStandardMaterial({
  color: '#101318', roughness: 0.92, metalness: 0.05,
  emissive: '#ffffff', emissiveIntensity: 1.6, emissiveMap: windowAtlas,
});
facadeMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = facadeUniforms.uTime;
  shader.uniforms.uEmissiveIntensity = { value: facadeMat.emissiveIntensity };
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `#include <common>
      varying vec3 vWpos;
      varying vec3 vNrm;
      varying vec2 vIhashUV;`)
    .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
      #ifdef USE_INSTANCING
        mat3 imn = mat3(instanceMatrix);
        vNrm = normalize(mat3(modelMatrix) * (imn * normal));
        float ihx = fract(sin(dot(instanceMatrix[3].xyz, vec3(12.9898, 78.233, 45.164))) * 43758.5453);
        float ihy = fract(sin(dot(instanceMatrix[3].xyz, vec3(93.9898, 67.345, 12.973))) * 12543.231);
        vIhashUV = vec2(ihx, ihy) * 12.0; // per-instance UV offset so towers never share window phase
      #else
        vNrm = normalize(mat3(modelMatrix) * normal);
        vIhashUV = vec2(0.0);
      #endif`)
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        vWpos = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
      #else
        vWpos = (modelMatrix * vec4(transformed, 1.0)).xyz;
      #endif`);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `#include <common>
      varying vec3 vWpos;
      varying vec3 vNrm;
      varying vec2 vIhashUV;
      uniform float uTime;
      uniform float uEmissiveIntensity;`)
    .replace('#include <color_fragment>', `#include <color_fragment>
      diffuseColor.rgb *= mix(0.55, 1.0, smoothstep(0.0, 12.0, vWpos.y)); // grime: darker near the street`)
    .replace('#include <emissivemap_fragment>', `
      vec3 an = abs(vNrm);
      float facadeU = an.x > 0.5 ? vWpos.z : vWpos.x; // pick the facade's own running axis
      vec2 wuv = vec2(facadeU / 2.0, vWpos.y / 3.3) + vIhashUV;
      vec2 cellId = floor(wuv);
      vec4 win = texture2D(emissiveMap, fract(wuv / vec2(12.0, 24.0)));
      float cellHash = fract(sin(dot(cellId, vec2(12.9898, 78.233))) * 43758.5453);
      float flicker = cellHash > 0.96 ? step(0.5, fract(uTime * (0.5 + cellHash))) : 1.0;
      vec3 winEmissive = an.y > 0.5 ? vec3(0.0) : win.rgb * flicker; // roof faces: no windows
      totalEmissiveRadiance = winEmissive * uEmissiveIntensity;`);
};

// ---------------------------------------------------------------- tower massing (setback tiers + rooftop clutter)
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const unitCyl = new THREE.CylinderGeometry(0.5, 0.5, 1, 8);

function buildInstMesh(geo, mat, list) {
  const mesh = new THREE.InstancedMesh(geo, mat, Math.max(list.length, 1));
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  list.forEach((t, i) => {
    p.set(t.cx, t.by + t.h / 2, t.cz);
    q.setFromEuler(new THREE.Euler(0, t.yaw, 0));
    s.set(t.w, t.h, t.d);
    m.compose(p, q, s);
    mesh.setMatrixAt(i, m);
  });
  mesh.count = list.length;
  mesh.instanceMatrix.needsUpdate = true;
  return mesh;
}

const baseTowers = [], midTowers = [], crownTowers = [], backTowers = [];
const clutterTanks = [], clutterACs = [], clutterAntennas = [];

function addClutter(list, cx, cz, by, w, h, d, yaw) { list.push({ cx, cz, by, w, h, d, yaw }); }

// scatter 1-3 rooftop pieces across a roof rectangle, keeping clear of whatever tier sits on top of
// it (coverHalfX/Z) so pieces read as sitting on the exposed setback ring, not buried inside a wall
function scatterRoofClutter(rnd, roofY, cx, cz, halfX, halfZ, coverHalfX, coverHalfZ) {
  const count = 1 + Math.floor(rnd() * 3);
  for (let i = 0; i < count; i++) {
    let px, pz, tries = 0;
    do {
      px = (rnd() - 0.5) * 1.64 * halfX;
      pz = (rnd() - 0.5) * 1.64 * halfZ;
      tries++;
    } while (coverHalfX && Math.abs(px) < coverHalfX && Math.abs(pz) < coverHalfZ && tries < 20);
    const yaw = rnd() * Math.PI * 2;
    const kind = rnd();
    if (kind < 0.4) {
      const r = 0.5 + rnd() * 0.5;
      addClutter(clutterTanks, cx + px, cz + pz, roofY, r * 2, 1.4 + rnd() * 1.2, r * 2, yaw);
    } else if (kind < 0.8) {
      addClutter(clutterACs, cx + px, cz + pz, roofY, 0.8 + rnd() * 0.8, 0.7 + rnd() * 0.6, 0.8 + rnd() * 0.8, yaw);
    } else {
      addClutter(clutterAntennas, cx + px, cz + pz, roofY, 0.12, 4 + rnd() * 6, 0.12, yaw);
    }
  }
}

for (const side of [-1, 1]) {
  const rnd = prng(side < 0 ? 4111 : 7331);
  let z = -20, guard = 0;
  while (z > -290 && guard++ < 40) {
    const baseW = 10 + rnd() * 8, baseD = 12 + rnd() * 8, baseH = 30 + rnd() * 40;
    const gap = 2 + rnd() * 4;
    const innerFace = ALLEY_HALF_W + 1.5 + rnd() * 4; // 5.1 - 9.1 m from the alley centerline
    const cx = side * (innerFace + baseW / 2), cz = z - baseD / 2;
    const yaw = (rnd() - 0.5) * 0.016; // +/-0.008 rad — enough to break the row's rhythm, not to lean

    baseTowers.push({ cx, cz, by: 0, w: baseW, h: baseH, d: baseD, yaw });
    let topY = baseH, midHalfX = 0, midHalfZ = 0;

    const hasMid = rnd() < 0.8;
    if (hasMid) {
      const inset = 0.15 + rnd() * 0.15;
      const midW = baseW * (1 - inset), midD = baseD * (1 - inset), midH = 15 + rnd() * 25;
      midTowers.push({ cx, cz, by: baseH, w: midW, h: midH, d: midD, yaw });
      midHalfX = midW / 2; midHalfZ = midD / 2;
      topY = baseH + midH;
    }

    const hasCrown = rnd() < 0.5;
    let crownHalfX = 0, crownHalfZ = 0;
    if (hasCrown) {
      const inset = 0.15 + rnd() * 0.2;
      const fromW = hasMid ? midHalfX * 2 : baseW, fromD = hasMid ? midHalfZ * 2 : baseD;
      const crownW = fromW * (1 - inset), crownD = fromD * (1 - inset), crownH = 8 + rnd() * 12;
      crownTowers.push({ cx, cz, by: topY, w: crownW, h: crownH, d: crownD, yaw });
      crownHalfX = crownW / 2; crownHalfZ = crownD / 2;
    }

    scatterRoofClutter(rnd, baseH, cx, cz, baseW / 2, baseD / 2, midHalfX, midHalfZ);
    if (hasMid) scatterRoofClutter(rnd, topY, cx, cz, midHalfX, midHalfZ, crownHalfX, crownHalfZ);

    z -= baseD + gap;
  }
}

// far silhouette skyline — same shared facade material so distant windows still glimmer through fog
const backRnd = prng(555111);
for (let i = 0; i < 30; i++) {
  const side = backRnd() < 0.5 ? -1 : 1;
  backTowers.push({
    cx: side * (15 + backRnd() * 45), cz: -20 - backRnd() * 270, by: 0,
    w: 10 + backRnd() * 18, h: 60 + backRnd() * 60, d: 10 + backRnd() * 18,
    yaw: (backRnd() - 0.5) * 0.03,
  });
}

scene.add(
  buildInstMesh(unitBox, facadeMat, baseTowers),
  buildInstMesh(unitBox, facadeMat, midTowers),
  buildInstMesh(unitBox, facadeMat, crownTowers),
  buildInstMesh(unitBox, facadeMat, backTowers),
);

const clutterMatTank = new THREE.MeshStandardMaterial({ color: '#2a2b30', roughness: 0.85, metalness: 0.2 });
const clutterMatAC = new THREE.MeshStandardMaterial({ color: '#22262c', roughness: 0.7, metalness: 0.3 });
const clutterMatAntenna = new THREE.MeshStandardMaterial({ color: '#101216', roughness: 0.6, metalness: 0.4 });
scene.add(
  buildInstMesh(unitCyl, clutterMatTank, clutterTanks),
  buildInstMesh(unitBox, clutterMatAC, clutterACs),
  buildInstMesh(unitCyl, clutterMatAntenna, clutterAntennas),
);

// SECTION: street — Task 3
// ---------------------------------------------------------------- wet street: reflector + puddle overlay
const ROAD_WIDTH = 9, ROAD_DEPTH = 340, ROAD_Z = -150; // centered under the flight path (camZ runs 0 -> -260)
const ROAD_Z_FRONT = ROAD_Z + ROAD_DEPTH / 2, ROAD_Z_BACK = ROAD_Z - ROAD_DEPTH / 2;
const ROAD_TILE_REPEAT = 28; // ~12 m per texture tile down the 340 m road
const ROAD_TILE_LEN = ROAD_DEPTH / ROAD_TILE_REPEAT;

// Reflector's mirror math derives its reflecting-plane normal from the *object's* matrixWorld
// rotation (see three/addons Reflector.js onBeforeRender), not from any rotation baked into the
// geometry itself. The plane geometry therefore stays in its default XY orientation and the
// Reflector instance gets rotated flat via Object3D.rotateX — mirroring the official three.js
// Reflector example convention. Baking `.rotateX()` into the geometry instead (visually identical
// for an ordinary mesh) would leave the mirror thinking its normal still points along +Z and break
// the reflection.
// Reflector.ReflectorShader runs `tonemapping_fragment` + `colorspace_fragment` on its OUTPUT —
// on top of the fact that every object it captures already ran those same chunks once when the
// inner scene render wrote them into the reflection render target. That double ACES pass crushes
// anything below ~mid-grey towards black before the `color` tint even multiplies in, so a
// near-black tint (the intuitive "dark wet asphalt" choice) multiplies an already-crushed signal
// down to nothing — confirmed empirically: the reflector was rendering, but invisible. A light
// grey tint compensates; it stays a *moody* street because the puddle-mask overlay below hides
// the mirror everywhere except the wet patches, so this brightness only ever reads as glossy
// puddle glare, never a bright floor.
const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_DEPTH);
const road = new Reflector(roadGeo, {
  textureWidth: 512, textureHeight: 512, // low-res: this re-renders the whole scene a 2nd time per frame
  color: 0x767e8a,
  multisample: 0, // matches shared/lib.js's isSoftwareRenderer MSAA caution — cheap target, skip it
});
road.rotateX(-Math.PI / 2);
road.position.set(0, 0, ROAD_Z);
scene.add(road);

// Puddle-mask asphalt overlay: a MeshStandardMaterial plane a hair above the reflector. Where its
// alpha is low (puddles) the reflector shows through crisp; where alpha is high (dry asphalt) it
// hides the mirror — a binary-ish wet/dry read that sells rain without real SSR.
function buildAsphaltTexture() {
  const SIZE = 1024;
  const c = document.createElement('canvas'); c.width = c.height = SIZE;
  const g = c.getContext('2d');
  const rnd = prng(31415);
  g.fillStyle = '#0e0f12';
  g.fillRect(0, 0, SIZE, SIZE);
  for (let i = 0; i < 4000; i++) { // fine noise speckle
    const v = 14 + rnd() * 20;
    g.fillStyle = `rgba(${v + 6},${v + 6},${v + 8},${0.12 + rnd() * 0.18})`;
    g.fillRect(rnd() * SIZE, rnd() * SIZE, 1 + rnd(), 1 + rnd());
  }
  const dash = SIZE * (1.5 / ROAD_TILE_LEN), gap = SIZE * (3.2 / ROAD_TILE_LEN); // dim dashed lane line
  g.fillStyle = '#5a4e2a';
  for (let y = 0; y < SIZE; y += dash + gap) g.fillRect(SIZE / 2 - 4, y, 8, dash);
  const aspect = ROAD_WIDTH / ROAD_TILE_LEN; // canvas is square, the physical tile isn't — keep circles round
  for (let i = 0; i < 3; i++) { // manhole covers
    const cx = SIZE * (0.15 + rnd() * 0.7), cy = SIZE * (0.15 + rnd() * 0.7), r = 26 + rnd() * 10;
    g.fillStyle = '#1c1d21';
    g.beginPath(); g.ellipse(cx, cy, r, r * aspect, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#35363a'; g.lineWidth = 2;
    g.beginPath(); g.ellipse(cx, cy, r * 0.72, r * 0.72 * aspect, 0, 0, Math.PI * 2); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, ROAD_TILE_REPEAT);
  tex.anisotropy = 8;
  return tex;
}

function buildPuddleMaskTexture() {
  const SIZE = 1024;
  const c = document.createElement('canvas'); c.width = c.height = SIZE;
  const g = c.getContext('2d');
  const rnd = prng(24601);
  g.fillStyle = '#f0f0f0'; // near-white = opaque dry asphalt (reflector hidden)
  g.fillRect(0, 0, SIZE, SIZE);
  g.filter = 'blur(14px)';
  for (let i = 0; i < 45; i++) { // puddles: darker = lower alpha = reflector shows through
    const rx = 35 + rnd() * 150, ry = rx * (0.5 + rnd() * 0.5);
    const dark = 12 + rnd() * 45;
    g.fillStyle = `rgb(${dark},${dark},${dark})`;
    g.beginPath();
    g.ellipse(rnd() * SIZE, rnd() * SIZE, rx, ry, rnd() * Math.PI, 0, Math.PI * 2);
    g.fill();
  }
  g.filter = 'none';
  // drier tire lanes at x ~= +/-1.2m: push those two bands back toward white without ever darkening
  g.globalCompositeOperation = 'lighten';
  g.filter = 'blur(50px)';
  for (const x of [-1.2, 1.2]) {
    const u = (x + ROAD_WIDTH / 2) / ROAD_WIDTH;
    g.fillStyle = 'rgba(255,255,255,0.85)';
    g.fillRect(u * SIZE - 65, 0, 130, SIZE);
  }
  g.globalCompositeOperation = 'source-over';
  g.filter = 'none';
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, ROAD_TILE_REPEAT);
  return tex;
}

// Low-frequency ripple normal map: paint a soft height field, then derive a normal from its gradient.
function buildRippleNormalTexture() {
  const SIZE = 256;
  const c = document.createElement('canvas'); c.width = c.height = SIZE;
  const g = c.getContext('2d');
  const rnd = prng(27182);
  g.fillStyle = '#808080'; g.fillRect(0, 0, SIZE, SIZE);
  g.filter = 'blur(10px)';
  for (let i = 0; i < 40; i++) {
    const v = 90 + rnd() * 80;
    g.fillStyle = `rgb(${v},${v},${v})`;
    g.beginPath(); g.arc(rnd() * SIZE, rnd() * SIZE, 10 + rnd() * 30, 0, Math.PI * 2); g.fill();
  }
  g.filter = 'none';
  const src = g.getImageData(0, 0, SIZE, SIZE);
  const h = (x, y) => src.data[((((y % SIZE) + SIZE) % SIZE) * SIZE + (((x % SIZE) + SIZE) % SIZE)) * 4] / 255;
  const out = g.createImageData(SIZE, SIZE);
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const nx = -(h(x + 1, y) - h(x - 1, y)) * 1.6, ny = -(h(x, y + 1) - h(x, y - 1)) * 1.6;
      const len = Math.hypot(nx, ny, 1);
      const idx = (y * SIZE + x) * 4;
      out.data[idx] = (nx / len * 0.5 + 0.5) * 255;
      out.data[idx + 1] = (ny / len * 0.5 + 0.5) * 255;
      out.data[idx + 2] = (1 / len * 0.5 + 0.5) * 255;
      out.data[idx + 3] = 255;
    }
  }
  g.putImageData(out, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, ROAD_TILE_REPEAT);
  return tex;
}

const overlayMat = new THREE.MeshStandardMaterial({
  map: buildAsphaltTexture(),
  alphaMap: buildPuddleMaskTexture(),
  normalMap: buildRippleNormalTexture(),
  transparent: true,
  roughness: 0.5, metalness: 0.2,
  polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1, // avoid z-fight with the reflector 1cm below
});
const overlay = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_DEPTH).rotateX(-Math.PI / 2), overlayMat);
overlay.position.set(0, 0.01, ROAD_Z);
scene.add(overlay);

// Curbs + damp sidewalks: one InstancedMesh (reuses the tower system's unitBox + buildInstMesh),
// segmented down the depth rather than one giant uniform slab.
const curbMat = new THREE.MeshStandardMaterial({ color: '#15171c', roughness: 0.55, metalness: 0.1, envMapIntensity: 0.4 });
const CURB_X0 = 4.35, CURB_X1 = 5.4; // curb face sits right at the reflector's edge (x=4.5), sidewalk behind it
const CURB_W = CURB_X1 - CURB_X0, CURB_CX = (CURB_X0 + CURB_X1) / 2, CURB_H = 0.15, SEG_LEN = 10;
const curbList = [];
for (const side of [-1, 1]) {
  for (let z = ROAD_Z_FRONT; z > ROAD_Z_BACK; z -= SEG_LEN) {
    curbList.push({ cx: side * CURB_CX, cz: z - SEG_LEN / 2, by: 0, w: CURB_W, h: CURB_H, d: SEG_LEN * 0.96, yaw: 0 });
  }
}
scene.add(buildInstMesh(unitBox, curbMat, curbList));

// SECTION: signs — Task 4
// SECTION: atmosphere — Task 5

// ---------------------------------------------------------------- signature element: volumetric neon rain
// Instanced elongated streaks (not dots) with additive blending — this is what actually reads as
// "rain" at a flight-through distance; sprite points at this scale were sub-pixel and invisible.
const RAIN_COUNT = 700;
const rainGeo = new THREE.PlaneGeometry(0.028, 0.7);
function rainStreakTexture() {
  const c = document.createElement('canvas'); c.width = 8; c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 64);
  grad.addColorStop(0, 'rgba(190,225,255,0)');
  grad.addColorStop(0.5, 'rgba(190,225,255,0.95)');
  grad.addColorStop(1, 'rgba(190,225,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 8, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const rainMat = new THREE.MeshBasicMaterial({
  map: rainStreakTexture(), transparent: true, opacity: 0.4, depthWrite: false,
  blending: THREE.AdditiveBlending, toneMapped: false, side: THREE.DoubleSide,
});
const rain = new THREE.InstancedMesh(rainGeo, rainMat, RAIN_COUNT);
const rainX = new Float32Array(RAIN_COUNT), rainZ = new Float32Array(RAIN_COUNT);
const rainY0 = new Float32Array(RAIN_COUNT), rainSpeed = new Float32Array(RAIN_COUNT);
for (let i = 0; i < RAIN_COUNT; i++) {
  rainX[i] = (Math.random() - 0.5) * (ALLEY_HALF_W * 2 + 3);
  // keep a dead zone right around the camera (±4) — many overlapping streaks that close to the lens
  // additively blow out to a solid white blob instead of reading as individual rain
  const sign = Math.random() < 0.5 ? -1 : 1;
  rainZ[i] = sign * (4 + Math.random() * 26);
  rainY0[i] = Math.random() * 16;
  rainSpeed[i] = 14 + Math.random() * 10;
}
scene.add(rain);
const _rm = new THREE.Matrix4(), _rq = new THREE.Quaternion(), _rs = new THREE.Vector3(1, 1, 1), _rp = new THREE.Vector3();
_rq.setFromEuler(new THREE.Euler(0.09, 0, 0)); // slight forward lean — reads as motion, not static rain

// ---------------------------------------------------------------- fill light (very dim — this is a neon-only scene)
scene.add(new THREE.AmbientLight(0x1a1030, 0.5));

// ---------------------------------------------------------------- panels + HUD
const panelWrap = document.querySelector('.panels');
STATIONS.forEach((s, i) => {
  const el = document.createElement('article');
  el.className = 'panel';
  el.innerHTML =
    `<div class="idx mono">${String(i).padStart(2, '0')} / ${String(N - 1).padStart(2, '0')}</div>
     <h2 class="label display">${s.label}</h2>
     <dl class="data">${s.data.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
     <p class="blurb">${s.blurb}</p>`;
  panelWrap.appendChild(el);
});
const panels = [...panelWrap.children];
const hudVal = document.querySelector('.hud .val');
const hudFill = document.querySelector('.hud .rail > i');
const root = document.documentElement;

// ---------------------------------------------------------------- post
const composer = makeComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.82);
composer.addPass(bloom);
const grade = makeGradePass({ aberration: 0.002, vignetteMin: 0.55, grain: 0.03 });
composer.addPass(grade);

// ---------------------------------------------------------------- scroll state
smoothScroll({ lerp: 0.08 });
document.querySelector('.spacer').style.height = (N * 100) + 'vh';
const state = { t: 0 };
ScrollTrigger.create({ trigger: '.spacer', start: 'top top', end: 'bottom bottom', scrub: 1,
  onUpdate: (self) => { state.t = self.progress; } });

let camZ = 0, camZTarget = 0;

function updateUI(seg) {
  // steep falloff with a hard zero below threshold — avoids two headlines double-exposing
  // on top of each other during the crossfade midpoint between stations
  panels.forEach((el, i) => {
    const d = Math.abs(seg - i);
    el.style.opacity = d > 0.45 ? 0 : (1 - d / 0.45).toFixed(3);
  });
  const active = Math.round(Math.min(seg, N - 1));
  root.style.setProperty('--accent', STATIONS[active].accent);
  const depth = Math.round(-camZ);
  hudVal.textContent = `${depth} m`;
  hudFill.style.width = (state.t * 100).toFixed(1) + '%';
}

// ---------------------------------------------------------------- resize + render
onResize((w, h) => { camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); composer.setSize(w, h); bloom.setSize(w, h); });
attachLifecycle(renderer, scene, composer);

loop((elapsed, dt) => {
  const seg = state.t * (N - 1);
  camZTarget = state.t * totalZ;
  // frame-rate-independent smoothing so headless screenshots settle like 60fps
  const k = 1 - Math.exp(-6.0 * dt);
  camZ += (camZTarget - camZ) * k;
  camera.position.z = camZ + 8;
  // handheld sway is purely cosmetic continuous motion — skip it under reduced-motion so the
  // camera holds still except for the scroll-driven flight itself
  camera.position.y = 3.0 + (reducedMotion ? 0 : Math.sin(elapsed * 0.6) * 0.1);
  camera.position.x = reducedMotion ? 0 : Math.sin(elapsed * 0.35) * 0.3;
  camera.lookAt(camera.position.x * 0.4, 2.6, camZ - 26);

  grade.uniforms.uTime.value = elapsed;
  facadeUniforms.uTime.value = elapsed;
  overlayMat.normalMap.offset.y = elapsed * 0.02; // slow scroll — subtle living-water shimmer on puddle edges

  // rain: fall + wrap in a band that follows the camera down the alley so it always surrounds the viewer
  for (let i = 0; i < RAIN_COUNT; i++) {
    let y = rainY0[i] - ((elapsed * rainSpeed[i]) % 16);
    y = ((y % 16) + 16) % 16;
    _rp.set(rainX[i], y, camera.position.z + rainZ[i]);
    _rm.compose(_rp, _rq, _rs);
    rain.setMatrixAt(i, _rm);
  }
  rain.instanceMatrix.needsUpdate = true;

  updateUI(seg);
  composer.render();
});

// close the loader once the first frames are ready (no external textures here)
setTimeout(() => { loader.set(1); loader.done(); }, 500);
</script>
</body>
</html>
