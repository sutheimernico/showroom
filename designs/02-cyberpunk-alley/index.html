<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wet Circuit — A Flight Through the Alley</title>
<meta name="description" content="Scroll down a rain-slicked cyberpunk alley, deeper and deeper, past neon signage that bleeds into the wet street below.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/base.css">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/index.js",
    "gsap/ScrollTrigger": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/ScrollTrigger.js",
    "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/",
    "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.mjs"
  }
}
</script>

<style>
  /* Design direction: NOT the generic "near-black + acid-green" AI cliché —
     hot magenta / electric cyan / warm amber signage on an indigo-black street. */
  :root { --accent: #ff2fb0; }
  body { background: #07040d; color: #f3e9ff; }

  .display { font-family: "Rajdhani", system-ui, sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

  .scrim { position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: linear-gradient(90deg, rgba(7,4,13,.88) 0%, rgba(7,4,13,.5) 22%, rgba(7,4,13,0) 48%); }

  .panels { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  .panel {
    position: absolute; left: clamp(24px, 6vw, 110px); top: 50%; transform: translateY(-50%);
    max-width: 33ch; opacity: 0; transition: opacity .5s ease; will-change: opacity;
    text-shadow: 0 1px 24px rgba(0,0,0,.7);
  }
  .panel .idx { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .22em; color: var(--accent); margin-bottom: 18px; }
  .panel .label {
    font-family: "Rajdhani", sans-serif; font-weight: 700; text-transform: uppercase;
    font-size: clamp(52px, 8.5vw, 128px); line-height: .9; letter-spacing: -.01em; margin: 0 0 .28em;
  }
  .panel .data { display: grid; gap: 9px; margin: 0 0 26px; max-width: 31ch; }
  .panel .data > div { display: flex; justify-content: space-between; gap: 16px; align-items: baseline;
    border-top: 1px solid rgba(255,255,255,.12); padding-top: 8px; }
  .panel .data dt { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .16em; color: rgba(243,233,255,.5); margin: 0; }
  .panel .data dd { font-family: "JetBrains Mono", monospace; font-size: 13px; color: #fff; margin: 0; text-align: right; }
  .panel .blurb { font-family: "Rajdhani", sans-serif; font-weight: 500; font-size: clamp(16px, 1.6vw, 19px);
    line-height: 1.55; color: rgba(243,233,255,.76); max-width: 34ch; }

  /* signature HUD: a scanline depth-readout, styled like a HUD overlay on a runner's visor */
  .hud { position: fixed; right: clamp(20px, 4vw, 56px); bottom: clamp(24px, 5vh, 56px); z-index: 8; text-align: right;
    text-shadow: 0 1px 18px rgba(0,0,0,.7); }
  .hud .cap { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .26em; color: rgba(243,233,255,.45); margin-bottom: 6px; }
  .hud .val { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: clamp(22px, 3vw, 38px); color: var(--accent);
    transition: color .6s ease; font-variant-numeric: tabular-nums; }
  .hud .rail { margin-top: 14px; width: clamp(120px, 16vw, 220px); height: 1px; background: rgba(255,255,255,.14); margin-left: auto; position: relative; }
  .hud .rail > i { position: absolute; left: 0; top: -1px; height: 3px; background: var(--accent); transition: width .15s linear, background .6s ease; }

  .loader { background: #07040d; }
  .loader .label { font-family: "JetBrains Mono", monospace; letter-spacing: .3em; font-size: 13px; color: var(--accent); margin-bottom: 16px; }
  .loader .bar > i { background: var(--accent); }
  .scroll-cue { color: rgba(243,233,255,.6); }

  @media (max-width: 720px) {
    .panel { max-width: 78vw; }
    .hud { display: none; }
  }
</style>
</head>
<body>

<a class="back mono" href="../../index.html">← Showroom</a>

<div class="loader">
  <div style="display:grid;place-items:center;gap:4px">
    <div class="label">ENTERING THE ALLEY</div>
    <div class="bar"><i></i></div>
  </div>
</div>

<div class="scrim" aria-hidden="true"></div>
<div class="panels"></div>

<div class="hud">
  <div class="cap mono">DEPTH TRAVELLED</div>
  <div class="val mono">0 m</div>
  <div class="rail"><i style="width:0%"></i></div>
</div>

<div class="scroll-cue mono" aria-hidden="true">Scroll to fly deeper</div>
<div class="spacer"></div>

<script type="module">
import { THREE, gsap, ScrollTrigger, makeRenderer, makeComposer, makeGradePass, attachLifecycle, smoothScroll, loop, onResize, loaderOverlay, reducedMotion } from '../../shared/lib.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const loader = loaderOverlay();

// ---------------------------------------------------------------- stations (the narrative beats)
const STATIONS = [
  { label: 'Entry', z: 0, accent: '#ff2fb0',
    data: [['SECTOR', '9 — Low Row'], ['RAIN', 'Continuous'], ['CURFEW', '02:00']],
    blurb: 'Neon leaks into the wet street before it ever hits the eye — every sign doubles itself in the puddles below.' },
  { label: 'Noodle Row', z: -70, accent: '#28e5ff',
    data: [['VENDORS', '40+ stalls'], ['STEAM', 'Rising'], ['SIGNAGE', 'Cyan dominant']],
    blurb: 'Steam off the food stalls catches the cyan signs and scatters them into soft halos overhead.' },
  { label: 'Data Market', z: -150, accent: '#ffb23c',
    data: [['TRAFFIC', 'Grey market'], ['DRONES', 'Patrol sweep'], ['LIGHT', 'Amber warning']],
    blurb: 'Amber warning strips replace the neon here — a quieter street that still watches you back.' },
  { label: 'The Undercut', z: -260, accent: '#ff2fb0',
    data: [['DEPTH', 'Sub-level 3'], ['SKY', 'Not visible'], ['EXIT', 'None marked']],
    blurb: 'The alley narrows and the signs stack higher, fighting for a sliver of a sky nobody down here has seen.' },
];
const N = STATIONS.length;
const totalZ = STATIONS[N - 1].z;

// ---------------------------------------------------------------- renderer / scene
const renderer = makeRenderer();
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a0c14');
scene.fog = new THREE.FogExp2('#0a0c14', 0.02);
const camera = new THREE.PerspectiveCamera(78, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 3.2, 8);

const ALLEY_HALF_W = 3.6; // narrow alley so buildings read close-up and signs fill the frame

// SECTION: buildings — Task 2
// SECTION: street — Task 3
// SECTION: signs — Task 4
// SECTION: atmosphere — Task 5

// ---------------------------------------------------------------- signature element: volumetric neon rain
// Instanced elongated streaks (not dots) with additive blending — this is what actually reads as
// "rain" at a flight-through distance; sprite points at this scale were sub-pixel and invisible.
const RAIN_COUNT = 700;
const rainGeo = new THREE.PlaneGeometry(0.028, 0.7);
function rainStreakTexture() {
  const c = document.createElement('canvas'); c.width = 8; c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 64);
  grad.addColorStop(0, 'rgba(190,225,255,0)');
  grad.addColorStop(0.5, 'rgba(190,225,255,0.95)');
  grad.addColorStop(1, 'rgba(190,225,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 8, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const rainMat = new THREE.MeshBasicMaterial({
  map: rainStreakTexture(), transparent: true, opacity: 0.4, depthWrite: false,
  blending: THREE.AdditiveBlending, toneMapped: false, side: THREE.DoubleSide,
});
const rain = new THREE.InstancedMesh(rainGeo, rainMat, RAIN_COUNT);
const rainX = new Float32Array(RAIN_COUNT), rainZ = new Float32Array(RAIN_COUNT);
const rainY0 = new Float32Array(RAIN_COUNT), rainSpeed = new Float32Array(RAIN_COUNT);
for (let i = 0; i < RAIN_COUNT; i++) {
  rainX[i] = (Math.random() - 0.5) * (ALLEY_HALF_W * 2 + 3);
  // keep a dead zone right around the camera (±4) — many overlapping streaks that close to the lens
  // additively blow out to a solid white blob instead of reading as individual rain
  const sign = Math.random() < 0.5 ? -1 : 1;
  rainZ[i] = sign * (4 + Math.random() * 26);
  rainY0[i] = Math.random() * 16;
  rainSpeed[i] = 14 + Math.random() * 10;
}
scene.add(rain);
const _rm = new THREE.Matrix4(), _rq = new THREE.Quaternion(), _rs = new THREE.Vector3(1, 1, 1), _rp = new THREE.Vector3();
_rq.setFromEuler(new THREE.Euler(0.09, 0, 0)); // slight forward lean — reads as motion, not static rain

// ---------------------------------------------------------------- fill light (very dim — this is a neon-only scene)
scene.add(new THREE.AmbientLight(0x1a1030, 0.5));

// ---------------------------------------------------------------- panels + HUD
const panelWrap = document.querySelector('.panels');
STATIONS.forEach((s, i) => {
  const el = document.createElement('article');
  el.className = 'panel';
  el.innerHTML =
    `<div class="idx mono">${String(i).padStart(2, '0')} / ${String(N - 1).padStart(2, '0')}</div>
     <h2 class="label display">${s.label}</h2>
     <dl class="data">${s.data.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
     <p class="blurb">${s.blurb}</p>`;
  panelWrap.appendChild(el);
});
const panels = [...panelWrap.children];
const hudVal = document.querySelector('.hud .val');
const hudFill = document.querySelector('.hud .rail > i');
const root = document.documentElement;

// ---------------------------------------------------------------- post
const composer = makeComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.82);
composer.addPass(bloom);
const grade = makeGradePass({ aberration: 0.002, vignetteMin: 0.55, grain: 0.03 });
composer.addPass(grade);

// ---------------------------------------------------------------- scroll state
smoothScroll({ lerp: 0.08 });
document.querySelector('.spacer').style.height = (N * 100) + 'vh';
const state = { t: 0 };
ScrollTrigger.create({ trigger: '.spacer', start: 'top top', end: 'bottom bottom', scrub: 1,
  onUpdate: (self) => { state.t = self.progress; } });

let camZ = 0, camZTarget = 0;

function updateUI(seg) {
  // steep falloff with a hard zero below threshold — avoids two headlines double-exposing
  // on top of each other during the crossfade midpoint between stations
  panels.forEach((el, i) => {
    const d = Math.abs(seg - i);
    el.style.opacity = d > 0.45 ? 0 : (1 - d / 0.45).toFixed(3);
  });
  const active = Math.round(Math.min(seg, N - 1));
  root.style.setProperty('--accent', STATIONS[active].accent);
  const depth = Math.round(-camZ);
  hudVal.textContent = `${depth} m`;
  hudFill.style.width = (state.t * 100).toFixed(1) + '%';
}

// ---------------------------------------------------------------- resize + render
onResize((w, h) => { camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); composer.setSize(w, h); bloom.setSize(w, h); });
attachLifecycle(renderer, scene, composer);

loop((elapsed, dt) => {
  const seg = state.t * (N - 1);
  camZTarget = state.t * totalZ;
  // frame-rate-independent smoothing so headless screenshots settle like 60fps
  const k = 1 - Math.exp(-6.0 * dt);
  camZ += (camZTarget - camZ) * k;
  camera.position.z = camZ + 8;
  // handheld sway is purely cosmetic continuous motion — skip it under reduced-motion so the
  // camera holds still except for the scroll-driven flight itself
  camera.position.y = 3.0 + (reducedMotion ? 0 : Math.sin(elapsed * 0.6) * 0.1);
  camera.position.x = reducedMotion ? 0 : Math.sin(elapsed * 0.35) * 0.3;
  camera.lookAt(camera.position.x * 0.4, 2.6, camZ - 26);

  grade.uniforms.uTime.value = elapsed;

  // rain: fall + wrap in a band that follows the camera down the alley so it always surrounds the viewer
  for (let i = 0; i < RAIN_COUNT; i++) {
    let y = rainY0[i] - ((elapsed * rainSpeed[i]) % 16);
    y = ((y % 16) + 16) % 16;
    _rp.set(rainX[i], y, camera.position.z + rainZ[i]);
    _rm.compose(_rp, _rq, _rs);
    rain.setMatrixAt(i, _rm);
  }
  rain.instanceMatrix.needsUpdate = true;

  updateUI(seg);
  composer.render();
});

// close the loader once the first frames are ready (no external textures here)
setTimeout(() => { loader.set(1); loader.done(); }, 500);
</script>
</body>
</html>
