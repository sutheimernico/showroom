<html lang="en">
<head>

<title>Coherence — 524,288 Particles Finding Shape</title>
<meta name="description" content="A GPU compute particle field drifts from chaos into a sphere, a torus, a double helix — scroll drives the simulation, not a video.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/index.js",
    "gsap/ScrollTrigger": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/ScrollTrigger.js",
    "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/",
    "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.mjs"
  }
}

<style>
  :root { --accent: #b9a6ff; }
  body { background: #050308; color: #f2eeff; }

  .display { font-family: "Chakra Petch", system-ui, sans-serif; }
  .mono { font-family: "Fira Code", ui-monospace, monospace; }

  .panels { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  .panel {
    position: absolute; left: clamp(24px, 6vw, 110px); top: 50%; transform: translateY(-50%);
    max-width: 32ch; opacity: 0; transition: opacity .5s ease; will-change: opacity;
  }
  .panel .idx { font-family: "Fira Code", monospace; font-size: 12px; letter-spacing: .2em; color: var(--accent); margin-bottom: 18px; transition: color .6s ease; }
  .panel .label {
    font-family: "Chakra Petch", sans-serif; font-weight: 600; text-transform: uppercase;
    font-size: clamp(44px, 7vw, 104px); line-height: .94; letter-spacing: -.01em; margin: 0 0 .3em;
  }
  .panel .data { display: grid; gap: 9px; margin: 0 0 26px; max-width: 30ch; }
  .panel .data > div { display: flex; justify-content: space-between; gap: 16px; align-items: baseline;
    border-top: 1px solid rgba(255,255,255,.12); padding-top: 8px; }
  .panel .data dt { font-family: "Fira Code", monospace; font-size: 11px; letter-spacing: .18em; color: rgba(242,238,255,.5); margin: 0; }
  .panel .data dd { font-family: "Fira Code", monospace; font-size: 13px; color: #fff; margin: 0; text-align: right; }
  .panel .blurb { font-family: "Chakra Petch", sans-serif; font-weight: 400; font-size: clamp(15px, 1.5vw, 18px);
    line-height: 1.6; color: rgba(242,238,255,.72); max-width: 34ch; }

  .hud { position: fixed; right: clamp(20px, 4vw, 56px); bottom: clamp(24px, 5vh, 56px); z-index: 8; text-align: right; }
  .hud .cap { font-family: "Fira Code", monospace; font-size: 10px; letter-spacing: .26em; color: rgba(242,238,255,.45); margin-bottom: 6px; }
  .hud .val { font-family: "Chakra Petch", monospace; font-weight: 600; font-size: clamp(22px, 3vw, 38px); color: var(--accent);
    transition: color .6s ease; text-transform: uppercase; }
  .hud .rail { margin-top: 14px; width: clamp(120px, 16vw, 220px); height: 1px; background: rgba(255,255,255,.14); margin-left: auto; position: relative; }
  .hud .rail > i { position: absolute; left: 0; top: -1px; height: 3px; background: var(--accent); transition: width .15s linear, background .6s ease; }

  /* technical readout — honest about which GPU backend is actually driving the compute */
  .diag { position: fixed; left: clamp(20px, 4vw, 56px); bottom: clamp(24px, 5vh, 56px); z-index: 8;
    font-family: "Fira Code", monospace; font-size: 11px; line-height: 1.9; letter-spacing: .04em; color: rgba(242,238,255,.55); }
  .diag b { color: rgba(242,238,255,.85); font-weight: 500; }

  .scrim { position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: linear-gradient(90deg, rgba(5,3,8,.8) 0%, rgba(5,3,8,.42) 20%, rgba(5,3,8,0) 46%); }

  .loader { background: #050308; }
  .loader .label { font-family: "Fira Code", monospace; letter-spacing: .3em; font-size: 13px; color: var(--accent); margin-bottom: 16px; }
  .loader .bar > i { background: var(--accent); }
  .scroll-cue { color: rgba(242,238,255,.6); }
</style>
</head>
<body>

<a class="back mono" href="../../index.html">← Showroom</a>

<div class="loader">
  <div style="display:grid;place-items:center;gap:4px">
    <div class="label">COMPILING COMPUTE PIPELINE</div>
    <div class="bar"><i></i></div>
  </div>
</div>

<div class="scrim" aria-hidden="true"></div>
<div class="panels"></div>

<div class="hud">
  <div class="cap mono">ACTIVE FORM</div>
  <div class="val mono">Dust</div>
  <div class="rail"><i style="width:0%"></i></div>
</div>

<div class="diag mono" aria-hidden="true">
  <div>PARTICLES <b class="particle-count">—</b></div>
  <div>BACKEND <b class="backend">—</b></div>
</div>

<div class="scroll-cue mono" aria-hidden="true">Scroll to let it find shape</div>
<div class="spacer"></div>

<script type="module">
import { gsap, ScrollTrigger, attachLifecycle, smoothScroll, loop, onResize, loaderOverlay, reducedMotion, clamp } from '../../shared/lib.js';
import * as THREE from 'three/webgpu';
import {
  Fn, uniform, instancedArray, instanceIndex, hash,
  vec3, vec4, color, float, uint, mix, sin, cos, PI, pass, renderOutput, uv,
} from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import { chromaticAberration } from 'three/addons/tsl/display/ChromaticAberrationNode.js';

const loader = loaderOverlay();
const motion = reducedMotion ? 0 : 1;

// ---------------------------------------------------------------- renderer (WebGPU, auto WebGL2 fallback)
// THREE.WebGPURenderer tries a real WebGPU adapter first and transparently falls back to a WebGL2
// backend if navigator.gpu is unavailable (headless Chromium in this repo's own shot.mjs harness
// always takes the fallback path — there's no WebGPU under SwiftShader — see AUTOPILOT_LOG.md).
const renderer = new THREE.WebGPURenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.domElement.classList.add('bg');
document.body.appendChild(renderer.domElement);
await renderer.init();
const usingWebGPU = renderer.backend.isWebGPUBackend === true;
document.querySelector('.backend').textContent = usingWebGPU ? 'WebGPU' : 'WebGL2 (fallback)';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);

// ---------------------------------------------------------------- compute particles
// The WebGL2 fallback backend emulates TSL compute via transform feedback — it works, but a
// software rasterizer (SwiftShader, which headless Chromium always uses — see AUTOPILOT_LOG.md)
// makes 500k+ particles worth of transform-feedback compute genuinely slow. Real WebGPU or a real
// GPU-backed WebGL2 fallback gets the full wow-checklist particle count; a detected software
// rasterizer gets a much smaller count so the piece stays responsive and testable.
function isSoftwareRasterizer() {
  if (usingWebGPU) return false;
  const gl = renderer.getContext();
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  const info = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
  return /swiftshader|llvmpipe|software/i.test(info);
}
const COUNT = isSoftwareRasterizer() ? Math.pow(2, 15) : Math.pow(2, 19); // 32,768 vs 524,288
document.querySelector('.particle-count').textContent = COUNT.toLocaleString('en-US');
const positions = instancedArray(COUNT, 'vec3');

// Four analytic target shapes, one per station. Each is a pure function of instanceIndex so no
// CPU-side shape data ever has to be uploaded — the GPU derives every particle's target position
// from a handful of hashed randoms, exactly like three's own compute-particle examples do.
const shapeDust = Fn(() => {
  const i = instanceIndex;
  const rx = hash(i.add(uint(11))).sub(0.5);
  const ry = hash(i.add(uint(2222))).sub(0.5);
  const rz = hash(i.add(uint(333333))).sub(0.5);
  return vec3(rx, ry, rz).mul(vec3(9.5, 5.5, 9.5));
});

const shapeSphere = Fn(() => {
  const i = instanceIndex;
  const u = hash(i.add(uint(41))).mul(PI).mul(2);
  const v = hash(i.add(uint(4242)));
  const jitter = hash(i.add(uint(424242))).mul(0.08).add(0.96);
  const cosPhi = v.mul(2).sub(1);
  const sinPhi = cosPhi.mul(cosPhi).oneMinus().max(0).pow(0.5);
  const R = float(3.3).mul(jitter);
  return vec3(sinPhi.mul(cos(u)), cosPhi, sinPhi.mul(sin(u))).mul(R);
});

const shapeTorus = Fn(() => {
  const i = instanceIndex;
  const u = hash(i.add(uint(51))).mul(PI).mul(2);
  const v = hash(i.add(uint(5151))).mul(PI).mul(2);
  const Rmain = float(3.1), rtube = float(1.0);
  const tubeR = Rmain.add(rtube.mul(cos(v)));
  return vec3(tubeR.mul(cos(u)), rtube.mul(sin(v)), tubeR.mul(sin(u)));
});

const shapeHelix = Fn(() => {
  const i = instanceIndex;
  const t = hash(i.add(uint(71))).mul(PI).mul(8); // 4 turns
  const strandPhase = hash(i.add(uint(717))).mul(2).floor().mul(PI); // 0 or π — two strands
  const jitter = hash(i.add(uint(7171))).mul(0.18);
  const Rh = float(2.5).add(jitter);
  const y = t.div(PI).sub(4).mul(1.15);
  return vec3(Rh.mul(cos(t.add(strandPhase))), y, Rh.mul(sin(t.add(strandPhase))));
});

const uT = uniform(0);      // blend factor between the two shapes of the active segment
const uEase = uniform(0.1); // dt-corrected inertia — see loop() below
const uFlow = uniform(0.4); // flow-field drift amount, zeroed under prefers-reduced-motion
const uClock = uniform(0);  // free-running clock for the flow field, independent of scroll

function makeUpdate(shapeA, shapeB) {
  return Fn(() => {
    const pos = positions.element(instanceIndex);
    const target = mix(shapeA(), shapeB(), uT);
    // cheap trig-based flow field: each particle drifts along a sine field keyed off its own
    // target position + a shared clock, giving an organic "alive" wobble without a full curl-noise
    // implementation — deliberately simple, this is the one signature effect of this piece.
    const flow = vec3(
      sin(target.y.mul(0.55).add(uClock.mul(0.4))),
      sin(target.z.mul(0.55).add(uClock.mul(0.5))),
      sin(target.x.mul(0.55).add(uClock.mul(0.33))),
    ).mul(uFlow);
    const goal = target.add(flow);
    pos.assign(pos.add(goal.sub(pos).mul(uEase)));
  })().compute(COUNT);
}

// one compute program per transition — cheaper and far simpler than branching on a shape index
// inside a single shader, and the CPU already knows which segment is active from scroll progress.
const updates = [
  makeUpdate(shapeDust, shapeSphere),
  makeUpdate(shapeSphere, shapeTorus),
  makeUpdate(shapeTorus, shapeHelix),
];

const initCompute = Fn(() => {
  positions.element(instanceIndex).assign(shapeDust());
})().compute(COUNT);
renderer.compute(initCompute);

// ---------------------------------------------------------------- material
const material = new THREE.SpriteNodeMaterial({ blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
material.positionNode = positions.toAttribute();
material.scaleNode = float(0.027);
const colorA = uniform(color('#8b5cf6')); // violet
const colorB = uniform(color('#22d3ee')); // cyan
material.colorNode = Fn(() => {
  const h = hash(instanceIndex.add(uint(999)));
  const base = mix(colorA, colorB, h);
  // twinkle is baked in at construction time from `motion`, not a runtime uniform — under
  // prefers-reduced-motion the field should hold still, not just stop drifting (see uFlow below)
  const twinkle = motion
    ? sin(uClock.mul(2.2).add(h.mul(6.283))).mul(0.18).add(0.82)
    : float(0.9);
  return vec4(base.mul(twinkle), 1);
})();

const particles = new THREE.Sprite(material);
particles.count = COUNT;
particles.frustumCulled = false;
scene.add(particles);

// ---------------------------------------------------------------- post: bloom → tonemap/colorspace → CA → grade
const renderPipeline = new THREE.RenderPipeline(renderer);
renderPipeline.outputColorTransform = false;
const scenePass = pass(scene, camera);
const scenePassColor = scenePass.getTextureNode('output');
const bloomPass = bloom(scenePassColor, 0.22, 0.15, 0.72);
const withBloom = renderOutput(scenePassColor.add(bloomPass));
const uAberr = uniform(0.35);
// center defaults to null in the addon's own JSDoc ("screen center"), but the null path isn't
// actually exercised by three's own example (it always passes an explicit Vector2) and errored
// here — pass the center explicitly instead of trusting the undocumented-in-practice default.
const withCA = chromaticAberration(withBloom, uAberr, new THREE.Vector2(0.5, 0.5), 1.15);

// vignette + grain, matching the shared WebGL grade recipe's look (shared/lib.js makeGradePass) —
// kept local since it's a TSL node graph, not a WebGL ShaderPass, so it can't reuse that helper.
const uGrainTime = uniform(0);
const graded = Fn(() => {
  const uvC = uv();
  const d = uvC.sub(0.5);
  const r2 = d.dot(d);
  const vig = mix(0.55, 1.0, r2.mul(2.2).smoothstep(0.9, 0.2));
  const n = hash(uvC.x.mul(12.9898).add(uvC.y.mul(78.233)).add(uGrainTime.mul(37.719)).fract().mul(43758.5453)).sub(0.5).mul(0.03);
  return withCA.mul(vig).add(vec4(n, n, n, 0));
})();
renderPipeline.outputNode = graded;

// ---------------------------------------------------------------- stations + panels + HUD
const STATIONS = [
  { label: 'Dust', accent: '#8b8698', data: [['STATE', 'Unresolved'], ['ENTROPY', 'Maximal']],
    blurb: 'Half a million points with no relationship to each other — a compute buffer seeded with noise, waiting for a rule.' },
  { label: 'Sphere', accent: '#8b5cf6', data: [['STATE', 'Converged'], ['SYMMETRY', 'Spherical']],
    blurb: 'The simplest rule wins first: every particle eases toward a point on a shell, no two exactly alike.' },
  { label: 'Torus', accent: '#22d3ee', data: [['STATE', 'Converged'], ['SYMMETRY', 'Toroidal']],
    blurb: 'The shell rule swaps for a ring rule — same 524,288 particles, same compute pass, a different destination.' },
  { label: 'Helix', accent: '#ff6ec7', data: [['STATE', 'Converged'], ['SYMMETRY', 'Two strands']],
    blurb: 'A double helix, still drifting on the flow field — coherent, but never quite still.' },
];
const panelWrap = document.querySelector('.panels');
STATIONS.forEach((s, i) => {
  const el = document.createElement('article');
  el.className = 'panel';
  el.innerHTML =
    `<div class="idx mono">${String(i).padStart(2, '0')} / ${String(STATIONS.length - 1).padStart(2, '0')}</div>
     <h2 class="label display">${s.label}</h2>
     <dl class="data">${s.data.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
     <p class="blurb">${s.blurb}</p>`;
  panelWrap.appendChild(el);
});
const panels = [...panelWrap.children];
const hudVal = document.querySelector('.hud .val');
const hudFill = document.querySelector('.hud .rail > i');
const root = document.documentElement;

function updateUI(seg) {
  panels.forEach((el, i) => {
    const d = Math.abs(seg - i);
    el.style.opacity = d > 0.45 ? 0 : (1 - d / 0.45).toFixed(3);
  });
  const active = Math.round(clamp(seg, 0, STATIONS.length - 1));
  root.style.setProperty('--accent', STATIONS[active].accent);
  hudVal.textContent = STATIONS[active].label;
}

// ---------------------------------------------------------------- scroll
smoothScroll({ lerp: 0.08 });
document.querySelector('.spacer').style.height = (STATIONS.length * 100) + 'vh';
const state = { t: 0 };
ScrollTrigger.create({ trigger: '.spacer', start: 'top top', end: 'bottom bottom', scrub: 1,
  onUpdate: (self) => { state.t = self.progress; } });

const smoother = (x) => x * x * x * (x * (x * 6 - 15) + 10);
attachLifecycle(renderer, scene, renderPipeline);

// ---------------------------------------------------------------- resize + render
onResize((w, h) => {
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

let camAngle0 = 0;
loop((elapsed, dt) => {
  const seg = state.t * (updates.length); // 0..3 across 3 transitions
  const segIdx = Math.min(Math.floor(seg), updates.length - 1);
  const segT = smoother(clamp(seg - segIdx, 0, 1));

  uT.value = segT;
  uEase.value = 1 - Math.exp(-4.0 * dt); // frame-rate-independent inertia (see 03-solar-journey's pattern)
  uClock.value = elapsed;
  uGrainTime.value = elapsed;
  uFlow.value = motion * 0.4;

  // camera: scroll drives a slow orbit + a dolly that pulls in as particles organize
  camAngle0 += motion * dt * 0.03;
  const angle = state.t * Math.PI * 1.4 + camAngle0;
  const radius = 15.5 - state.t * 6.5;
  // stay elevated throughout: the torus/helix targets both lie flat in XZ, so a
  // near-zero camera height reads as a featureless oval blob — a steady 3/4 downward
  // angle is what actually shows the torus hole and the helix's coil.
  const height = 7.8 - state.t * 2.4;
  camera.position.set(Math.cos(angle) * radius, height, Math.sin(angle) * radius);
  camera.lookAt(0, 0, 0);

  renderer.compute(updates[segIdx]);
  renderPipeline.render();

  updateUI(seg);
});

setTimeout(() => { loader.set(1); loader.done(); }, 700);
</script>
</body>
</html>
